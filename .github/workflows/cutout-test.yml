name: Тест вирізання фону
on:
  workflow_dispatch:
    inputs:
      url: {required: true}
      models: {default: "u2net_human_seg birefnet-portrait"}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python tools/cutout_test.py "${{ inputs.url }}" ${{ inputs.models }}
      - uses: actions/upload-artifact@v4
        with: {name: cutout, path: cutout_test.jpg}
