<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Обвести контур</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
 html,body{margin:0;background:#1c1b1a;color:#eee;font:15px -apple-system,Roboto,sans-serif;overscroll-behavior:none}
 p{margin:10px 14px}
 #wrap{position:relative;margin:0 auto;touch-action:none}
 #wrap img,#wrap canvas{position:absolute;left:0;top:0;width:100%;height:100%}
 .bar{display:flex;gap:10px;padding:12px 14px}
 button{flex:1;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:600}
 #clear{background:#3c3c3c;color:#eee} #done{background:#FFCC33;color:#222}
</style></head><body>
<p>Обведи людину пальцем одним рухом — разом із головним убором, руками й одягом, які мають лишитися. Можна грубо: точний край знайде нейромережа.</p>
<div id="wrap"><img id="img" crossorigin="anonymous"><canvas id="cv"></canvas></div>
<div class="bar"><button id="clear">Очистити</button><button id="done">Готово</button></div>
<script>
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
const q = new URLSearchParams(location.search);
const img = document.getElementById('img'), cv = document.getElementById('cv'), wrap = document.getElementById('wrap');
const ctx = cv.getContext('2d'); let pts = [], drawing = false;
img.onload = () => {
  const maxW = Math.min(window.innerWidth, 600), maxH = window.innerHeight - 190;
  let w = maxW, h = w * img.naturalHeight / img.naturalWidth;
  if (h > maxH) { h = maxH; w = h * img.naturalWidth / img.naturalHeight; }
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
  cv.width = w * 2; cv.height = h * 2;
};
img.src = q.get('img');
function pos(e) { const r = cv.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
  return [(t.clientX - r.left) / r.width, (t.clientY - r.top) / r.height]; }
function redraw(closed) {
  ctx.clearRect(0, 0, cv.width, cv.height); if (pts.length < 2) return;
  ctx.beginPath(); ctx.moveTo(pts[0][0] * cv.width, pts[0][1] * cv.height);
  for (const p of pts) ctx.lineTo(p[0] * cv.width, p[1] * cv.height);
  if (closed) { ctx.closePath(); ctx.fillStyle = 'rgba(255,204,51,0.25)'; ctx.fill(); }
  ctx.strokeStyle = '#ff7a33'; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.stroke();
}
function start(e) { e.preventDefault(); drawing = true; pts = [pos(e)]; redraw(); }
function move(e) { if (!drawing) return; e.preventDefault(); const p = pos(e), l = pts[pts.length - 1];
  if (Math.hypot(p[0] - l[0], p[1] - l[1]) > 0.006) { pts.push(p); redraw(); } }
function end() { if (!drawing) return; drawing = false; redraw(true); }
cv.addEventListener('touchstart', start, {passive: false}); cv.addEventListener('touchmove', move, {passive: false});
cv.addEventListener('touchend', end); cv.addEventListener('mousedown', start);
cv.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
document.getElementById('clear').onclick = () => { pts = []; redraw(); };
document.getElementById('done').onclick = () => {
  if (pts.length < 8) { (tg ? tg.showAlert : alert)('Спершу обведи людину.'); return; }
  let p = pts; const step = Math.ceil(p.length / 180); p = p.filter((_, i) => i % step === 0);
  const data = JSON.stringify({id: q.get('id'), p: p.map(([x, y]) => [Math.round(x * 999), Math.round(y * 999)])});
  if (tg && tg.sendData) tg.sendData(data); else alert(data);
};
</script></body></html>
